[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-quality-gate"
dynamic = ["version"]
description = "A rules-driven quality gate for CSV files, with reports for people and CI."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Abhirup Khan" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest", "hypothesis"]

[project.scripts]
qualitygate = "qualitygate.cli:main"

[project.urls]
Source = "https://github.com/Abhirup-code/CSV_Quality_Gate"

[tool.setuptools]
packages = ["qualitygate"]

[tool.setuptools.dynamic]
version = { attr = "qualitygate.__version__" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S314"]  # asserts, and parsing XML this tool wrote itself
"examples/*" = ["S311"]
