name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Installs as a package with a qualitygate command
        run: |
          pip install .
          qualitygate --version
      - name: Clean sample should pass
        run: python -m qualitygate examples/orders_clean.csv --rules examples/orders_rules.json --out reports/clean
      - name: Dirty sample should fail with exit code 1
        run: |
          code=0
          python -m qualitygate examples/orders_dirty.csv --rules examples/orders_rules.json --out reports/dirty || code=$?
          test "$code" -eq 1
      - name: Rules inferred from the clean sample pass it, and still catch the dirty one
        run: |
          python -m qualitygate infer examples/orders_clean.csv --out reports/inferred_rules.json
          python -m qualitygate examples/orders_clean.csv --rules reports/inferred_rules.json --out reports/inferred-clean
          code=0
          python -m qualitygate examples/orders_dirty.csv --rules reports/inferred_rules.json --out reports/inferred-dirty || code=$?
          test "$code" -eq 1
      - name: Quarantine and JUnit report for the dirty sample
        run: |
          code=0
          python -m qualitygate examples/orders_dirty.csv --rules examples/orders_rules.json --out reports/quarantine \
            --quarantine reports/quarantine --junit reports/junit.xml || code=$?
          test "$code" -eq 1
          test "$(wc -l < reports/quarantine/failed.csv)" -eq 11
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sample-reports
          path: reports/

  action:
    name: The reusable action passes clean data and fails dirty data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Clean sample
        id: clean
        uses: ./
        with:
          csv: examples/orders_clean.csv
          rules: examples/orders_rules.json
          out: reports/action-clean
      - name: Dirty sample (expected to fail)
        id: dirty
        continue-on-error: true
        uses: ./
        with:
          csv: examples/orders_dirty.csv
          rules: examples/orders_rules.json
          out: reports/action-dirty
          quarantine: reports/action-quarantine
          junit: reports/action-junit.xml
      - name: Dirty sample within a 5% tolerance
        id: tolerant
        uses: ./
        with:
          csv: examples/orders_dirty.csv
          rules: examples/orders_rules.json
          out: reports/action-tolerant
          max-error-rate: "5"
      - name: Check the outcomes and outputs
        env:
          CLEAN: ${{ steps.clean.outputs.status }}
          DIRTY: ${{ steps.dirty.outcome }}
          DIRTY_STATUS: ${{ steps.dirty.outputs.status }}
          DIRTY_ERRORS: ${{ steps.dirty.outputs.errors }}
          TOLERANT: ${{ steps.tolerant.outputs.status }}
        run: |
          test "$CLEAN" = PASS
          test "$DIRTY" = failure
          test "$DIRTY_STATUS" = FAIL
          test "$DIRTY_ERRORS" = 11
          test "$TOLERANT" = PASS
          test -f reports/action-quarantine/failed.csv
          test -f reports/action-junit.xml
